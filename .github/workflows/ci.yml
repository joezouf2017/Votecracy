name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r backend/requirements.txt

      # No services block. Redis and Postgres are replaced by in-process
      # stand-ins, so the suite needs no containers — see docs/architecture.md.
      - run: python -m pytest backend -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm test
      # Catches a broken build that the tests would not: vitest transforms
      # modules on demand, `vite build` type-checks the whole graph.
      - run: npm run build

  cold-start:
    # The bug this guards against only appears on a clean machine: depends_on
    # waits for containers to start, not for services to accept connections,
    # and the backend runs migrations before uvicorn. Development never hits
    # it because the database container is always already warm.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: docker compose up -d --build

      - name: Wait for the backend to answer
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health; then exit 0; fi
            sleep 2
          done
          echo "backend never became healthy"
          docker compose logs
          exit 1

      - if: always()
        run: docker compose down -v
