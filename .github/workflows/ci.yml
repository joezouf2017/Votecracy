name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pinned in requirements-dev.txt; installed alone so a lint failure is
      # never confused with a dependency problem.
      - run: pip install "ruff==0.7.4"
      - run: ruff check backend
      - run: ruff format --check backend

      # Structure only, not freshness. CI has no corpus -- the cold-start job
      # brings up empty containers -- so it cannot tell whether a generated
      # figure is current. It can tell whether someone hand-edited inside a
      # generated block or deleted one, which is a different failure and a real
      # one. Freshness is checked locally; see README.
      - run: python docs/refresh.py --markers

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - run: pip install -r backend/requirements-dev.txt

      # No services block. Redis and Postgres are replaced by in-process
      # stand-ins, so the suite needs no containers — see docs/architecture.md.
      - run: python -m pytest backend -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      # Catches a broken build that the tests would not: vitest transforms
      # modules on demand, `vite build` type-checks the whole graph.
      - run: npm run build

  cold-start:
    # The bug this guards against only appears on a clean machine: depends_on
    # waits for containers to start, not for services to accept connections,
    # and the backend runs migrations before uvicorn. Development never hits
    # it because the database container is always already warm.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: docker compose up -d --build

      - name: Wait for the backend to answer
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health; then exit 0; fi
            sleep 2
          done
          echo "backend never became healthy"
          docker compose logs
          exit 1

      - if: always()
        run: docker compose down -v
