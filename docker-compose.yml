services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://votecracy:votecracy@postgres:5432/votecracy
      - REDIS_URL=redis://redis:6379/0
      # Comma-separated. Change this if the frontend moves off Vite's port.
      - CORS_ORIGINS=http://localhost:5173
    depends_on:
      # `depends_on` alone waits for the container to start, not for the
      # service to accept connections. The container runs `alembic upgrade
      # head` before uvicorn, so an unready Postgres kills it outright — a
      # cold `docker compose up` on a clean machine fails without this.
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app

  postgres:
    image: postgres:16-alpine
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U votecracy -d votecracy"]
      interval: 2s
      timeout: 3s
      retries: 15
    environment:
      - POSTGRES_USER=votecracy
      - POSTGRES_PASSWORD=votecracy
      - POSTGRES_DB=votecracy
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    # AOF, not the default RDB-only. RDB snapshots on graceful shutdown and on
    # the `save` windows, so a hard crash can lose everything written since the
    # last one — up to an hour under light load. appendfsync everysec caps the
    # loss at roughly a second of votes. The named volume matters as much as
    # the flag: without it the append log dies with the container.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata: